<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · promptlog</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;600&display=swap">
<style>
:root { --bg: #f4f5f2; --surface: #fff; --ink: #121614; --ink-2: #39423d; --muted: #646d68; --line: #d7dbd4; --brand: #c2410c; --del: #b42318; --del-bg: #fbe7e5; --add: #1a7f37; --add-bg: #e2f3e6; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d0f0e; --surface: #161a18; --ink: #e8ece9; --ink-2: #bcc4bf; --muted: #8b958f; --line: #262b28; --brand: #f2814f; --del: #f58a80; --del-bg: rgb(229 83 75 / .16); --add: #72d48c; --add-bg: rgb(46 160 67 / .16); color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--ink); font: 17px/1.55 'Schibsted Grotesk', system-ui, sans-serif; }
main { width: 100%; max-width: 560px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 800 19px/1 'Bricolage Grotesque', sans-serif; color: var(--ink); text-decoration: none; }
.brand::before { content: ''; width: 6px; height: 20px; border-radius: 1px; background: var(--brand); }
h1 { font: 800 clamp(36px, 8vw, 56px)/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em; margin: 40px 0 20px; }
.diff { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font: 400 15px/1.5 'IBM Plex Mono', monospace; }
.diff div { padding: 10px 14px; }
.diff .d { background: var(--del-bg); color: var(--del); }
.diff .a { background: var(--add-bg); color: var(--add); }
a.home { display: inline-flex; margin-top: 28px; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/">promptlog</a>
  <h1>No page here.</h1>
  <div class="diff" aria-hidden="true">
    <div class="d">− this page</div>
    <div class="a">+ the homepage</div>
  </div>
  <a class="home" href="/">Go to the homepage</a>
</main>
</body>
</html>
